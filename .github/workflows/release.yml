# Release builds: the ANT+ network key comes from the repository secret
# ANT_PLUS_NETWORK_KEY and is compiled into the binaries (make release);
# it never appears in the source, which a test checks with the same secret.
#
#   push a tag v*        → make check, make release, a draft GitHub release
#                          with the Linux tar.gz/.deb/.rpm (with the 3D view
#                          and the ready-built worlds), macOS universal
#                          tar.gz and SHA256SUMS. The maintainer checks it
#                          and publishes it by hand: releases are immutable
#                          once published (files and tag can't change).
#   run manually         → the same build, archives kept as workflow artifacts only
#
# The actions are pinned to commits (the tag they had in the comment): this
# job holds the key and may create releases, so a moved tag mustn't change
# what runs. Update them by looking up the new tag's commit.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # creating the release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANT_PLUS_NETWORK_KEY: ${{ secrets.ANT_PLUS_NETWORK_KEY }}
    steps:
      # The secret is masked in logs as stored; the build strips 0x and
      # separators, so mask the forms it uses too, in case one is printed.
      - name: Mask the network key in every form
        run: |
          k=$(printf '%s' "$ANT_PLUS_NETWORK_KEY" | sed 's/0[xX]//g' | tr -cd '0-9a-fA-F')
          if [[ -n $k ]]; then
            echo "::add-mask::$k"
            echo "::add-mask::${k,,}"
            echo "::add-mask::${k^^}"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # git describe needs the tags
          persist-credentials: false # the release uses its own token below

      # Releases come from main: the tag goes on the release's merge commit
      # there. A tag anywhere else (develop, a release branch) fails here.
      - name: Only tags on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main: tag the release's merge commit on main"
            exit 1
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check (including that the key isn't in the source)
        run: make check

      # The 3D view: .NET, and Godot with its export templates (1.3 GB,
      # pinned by SHA-512 in scripts/godot.sh), kept between runs.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: The 3D view's tests
        run: dotnet test renderers/godot/tests/Hud

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _godot
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('scripts/godot.sh') }}

      # The ready-built worlds' map data and AHN tiles: fetched once, then
      # only what a changed route needs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _release-cache
          key: release-cache-${{ hashFiles('internal/course/routes/*') }}
          restore-keys: release-cache-

      - name: Godot for the 3D view
        run: echo "GODOT=$(scripts/godot.sh)" >> "$GITHUB_ENV"

      - name: Build release archives
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            make release VERSION="$GITHUB_REF_NAME"
          else
            make release # named by git describe
          fi

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Hand-written notes in notes/<tag>.md when there are any. A draft
        # with every file attached; publishing it is the maintainer's step.
        run: |
          if [[ -f "notes/${GITHUB_REF_NAME}.md" ]]; then
            notes=(--notes-file "notes/${GITHUB_REF_NAME}.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag "${notes[@]}" _dist/*

      - name: Keep the archives (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: osscycler-${{ github.sha }}
          path: _dist/
          retention-days: 7
